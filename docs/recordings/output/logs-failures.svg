<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .bar { fill: #313244; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
      .prompt { fill: #cdd6f4; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; }
      .command { fill: #89b4fa; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; }
      .output { fill: #a6adc8; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .error { fill: #f38ba8; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .success { fill: #a6e3a1; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .warn { fill: #f9e2af; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .dim { fill: #6c7086; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12px; }
      .title { fill: #cdd6f4; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="500" rx="8"/>

  <!-- Title bar -->
  <rect class="bar" width="900" height="40" rx="8"/>
  <rect class="bg" y="32" width="900" height="10"/>
  <circle class="dot-red" cx="20" cy="20" r="6"/>
  <circle class="dot-yellow" cx="40" cy="20" r="6"/>
  <circle class="dot-green" cx="60" cy="20" r="6"/>
  <text class="title" x="450" y="25" text-anchor="middle">sparecrow logs --failures</text>

  <!-- Command -->
  <text class="prompt" x="20" y="70">$</text>
  <text class="command" x="35" y="70">sparecrow logs --failures</text>

  <!-- Table header -->
  <text class="output" x="20" y="100">Time                 Task              Outcome   Duration</text>
  <text class="output" x="20" y="115">-------------------  ----------------  --------  --------</text>

  <!-- Failed entries -->
  <text class="error" x="20" y="135">2026-03-17 02:15:00  security-audit    failed    12m 34s</text>
  <text class="dim" x="40" y="155">Container exited with code 1: OOM killed (memory limit 512MB)</text>

  <text class="warn" x="20" y="180">2026-03-16 23:45:00  fix-bugs          retrying  60m 00s</text>
  <text class="dim" x="40" y="200">Task timed out after 60 minutes, will retry (attempt 1/3)</text>

  <text class="error" x="20" y="225">2026-03-16 22:30:00  write-tests       failed    5m 12s</text>
  <text class="dim" x="40" y="245">Container runtime error: image pull failed (network unreachable)</text>

  <!-- Summary -->
  <text class="output" x="20" y="280">Showing 3 of 3 failure entries (last 7 days)</text>

  <!-- Second command -->
  <text class="prompt" x="20" y="320">$</text>
  <text class="command" x="35" y="320">sparecrow logs --count 5</text>

  <!-- Recent logs -->
  <text class="output" x="20" y="350">Time                 Task              Outcome   Duration</text>
  <text class="output" x="20" y="365">-------------------  ----------------  --------  --------</text>
  <text class="success" x="20" y="385">2026-03-17 03:00:00  improve-code      success   8m 45s</text>
  <text class="success" x="20" y="405">2026-03-17 02:45:00  security-audit    success   6m 12s</text>
  <text class="error" x="20" y="425">2026-03-17 02:15:00  security-audit    failed    12m 34s</text>
  <text class="success" x="20" y="445">2026-03-17 01:30:00  write-tests       success   15m 20s</text>
  <text class="warn" x="20" y="465">2026-03-16 23:45:00  fix-bugs          retrying  60m 00s</text>

</svg>
