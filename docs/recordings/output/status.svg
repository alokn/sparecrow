<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .bar { fill: #313244; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
      .prompt { fill: #cdd6f4; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; }
      .command { fill: #89b4fa; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; }
      .output { fill: #a6adc8; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .success { fill: #a6e3a1; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .accent { fill: #cba6f7; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .dim { fill: #6c7086; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12px; }
      .title { fill: #cdd6f4; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="500" rx="8"/>

  <!-- Title bar -->
  <rect class="bar" width="900" height="40" rx="8"/>
  <rect class="bg" y="32" width="900" height="10"/>
  <circle class="dot-red" cx="20" cy="20" r="6"/>
  <circle class="dot-yellow" cx="40" cy="20" r="6"/>
  <circle class="dot-green" cx="60" cy="20" r="6"/>
  <text class="title" x="450" y="25" text-anchor="middle">sparecrow status --all</text>

  <!-- status --all command -->
  <text class="prompt" x="20" y="70">$</text>
  <text class="command" x="35" y="70">sparecrow status --all</text>

  <!-- Daemon card -->
  <text class="accent" x="20" y="100">&#x250C;&#x2500; Daemon &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2510;</text>
  <text class="success" x="20" y="120">&#x2502; Status:  running (PID 12345)            &#x2502;</text>
  <text class="output" x="20" y="140">&#x2502; Uptime:  2h 15m                          &#x2502;</text>
  <text class="output" x="20" y="160">&#x2502; Next poll: 4m 12s                        &#x2502;</text>
  <text class="output" x="20" y="180">&#x2502; Polling interval: 300s                   &#x2502;</text>
  <text class="accent" x="20" y="200">&#x2514;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;</text>

  <!-- Usage card -->
  <text class="accent" x="20" y="230">&#x250C;&#x2500; Capacity &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2510;</text>
  <text class="output" x="20" y="250">&#x2502; Model: claude-3.5-sonnet                &#x2502;</text>
  <text class="output" x="20" y="270">&#x2502; Used: 42% (168/400 messages)             &#x2502;</text>
  <text class="output" x="20" y="290">&#x2502; Waste potential: 28%                     &#x2502;</text>
  <text class="output" x="20" y="310">&#x2502; Reserve: 30% (120 messages held)         &#x2502;</text>
  <text class="output" x="20" y="330">&#x2502; Idle hours: active (22:00-06:00)         &#x2502;</text>
  <text class="accent" x="20" y="350">&#x2514;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;</text>

  <!-- Queue card -->
  <text class="accent" x="20" y="380">&#x250C;&#x2500; Queue &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2510;</text>
  <text class="output" x="20" y="400">&#x2502; Depth: 2 tasks (dispatch: active)        &#x2502;</text>
  <text class="output" x="20" y="420">&#x2502;   1. security-audit  /home/user/project   &#x2502;</text>
  <text class="output" x="20" y="440">&#x2502;   2. fix-bugs        /home/user/api        &#x2502;</text>
  <text class="accent" x="20" y="460">&#x2514;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;</text>

</svg>
