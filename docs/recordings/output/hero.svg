<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .bar { fill: #313244; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
      .prompt { fill: #cdd6f4; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; }
      .command { fill: #89b4fa; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; }
      .output { fill: #a6adc8; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .success { fill: #a6e3a1; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .accent { fill: #cba6f7; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .dim { fill: #6c7086; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12px; }
      .title { fill: #cdd6f4; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="500" rx="8"/>

  <!-- Title bar -->
  <rect class="bar" width="900" height="40" rx="8"/>
  <rect class="bg" y="32" width="900" height="10"/>
  <circle class="dot-red" cx="20" cy="20" r="6"/>
  <circle class="dot-yellow" cx="40" cy="20" r="6"/>
  <circle class="dot-green" cx="60" cy="20" r="6"/>
  <text class="title" x="450" y="25" text-anchor="middle">sparecrow -- Make It Count</text>

  <!-- Line 1: onboard command -->
  <text class="prompt" x="20" y="70">$</text>
  <text class="command" x="35" y="70">sparecrow onboard</text>

  <!-- Line 2-3: onboard output (abbreviated) -->
  <text class="success" x="20" y="95">&#x2713; Claude Code detected at /usr/local/bin/claude</text>
  <text class="success" x="20" y="115">&#x2713; OAuth token valid (expires 2026-04-01)</text>
  <text class="success" x="20" y="135">&#x2713; Configuration saved</text>

  <!-- Line 4: queue add command -->
  <text class="prompt" x="20" y="170">$</text>
  <text class="command" x="35" y="170">sparecrow queue add --template security-audit --target .</text>

  <!-- Line 5: queue add output -->
  <text class="success" x="20" y="195">&#x2713; Task added at position 1: security-audit</text>
  <text class="output" x="20" y="215">  target: /home/user/my-project</text>

  <!-- Line 6: status command -->
  <text class="prompt" x="20" y="250">$</text>
  <text class="command" x="35" y="250">sparecrow status</text>

  <!-- Status output -->
  <text class="accent" x="20" y="280">&#x250C;&#x2500; Daemon &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2510;</text>
  <text class="output" x="20" y="300">&#x2502; Status:  running (PID 12345)   &#x2502;</text>
  <text class="output" x="20" y="320">&#x2502; Uptime:  2h 15m                &#x2502;</text>
  <text class="accent" x="20" y="340">&#x2514;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;</text>
  <text class="accent" x="20" y="370">&#x250C;&#x2500; Usage &#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2510;</text>
  <text class="output" x="20" y="390">&#x2502; Capacity: 42% used             &#x2502;</text>
  <text class="output" x="20" y="410">&#x2502; Waste potential: 28%           &#x2502;</text>
  <text class="output" x="20" y="430">&#x2502; Queue depth: 1 task            &#x2502;</text>
  <text class="accent" x="20" y="450">&#x2514;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2518;</text>

</svg>
