name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Audit production dependencies early in setup to gate all downstream jobs;
      # fail on high/critical severity so unit-tests, e2e-tests, and macos-tests
      # cannot run against unaudited packages even under cancel-in-progress concurrency.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  lint-check:
    name: Lint & Type Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Audit production dependencies only; fail on high/critical severity
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }}, shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', 'latest']
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (shard ${{ matrix.shard }}/3)
        run: npx vitest run --shard=${{ matrix.shard }}/3

  unit-tests-coverage:
    name: Unit Tests (coverage)
    needs: [setup, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test

  macos-tests:
    name: macOS Tests
    if: github.repository == 'alokn/sparecrow'
    needs: setup
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Audit production dependencies on macOS — optional native deps can resolve
      # differently from Linux, creating a platform-specific supply-chain blind spot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npx vitest run

  e2e-tests:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check E2E
        run: npm run typecheck:e2e

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 15
