name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      sbom-artifact: sbom.cdx.json
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Audit production dependencies only; fail on high/critical severity
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Generate CycloneDX SBOM for production dependencies (deterministic from package-lock.json)
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@4.2.1 --omit=dev --output-file sbom.cdx.json --output-format JSON --spec-version 1.5

      - name: Verify publishing from public repo
        run: |
          if [[ "$GITHUB_REPOSITORY" != "alokn/sparecrow" ]]; then
            echo "Publishing is only allowed from alokn/sparecrow. Exiting."
            exit 1
          fi

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-beta* ]]; then
            npm publish --tag beta --provenance --access public
          elif [[ "$VERSION" == *-alpha* ]] || [[ "$VERSION" == *-rc* ]]; then
            npm publish --tag next --provenance --access public
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload SBOM artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 1

  upload-sbom:
    name: Upload SBOM to GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Upload SBOM to GitHub Release
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
