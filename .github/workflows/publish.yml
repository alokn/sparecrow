name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify publishing from public repo
        run: |
          if [[ "$GITHUB_REPOSITORY" != "alokn/sparecrow" ]]; then
            echo "Publishing is only allowed from alokn/sparecrow. Exiting."
            exit 1
          fi

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-beta* ]]; then
            npm publish --tag beta --provenance --access public
          elif [[ "$VERSION" == *-alpha* ]] || [[ "$VERSION" == *-rc* ]]; then
            npm publish --tag next --provenance --access public
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
