repos:
  - repo: local
    hooks:
      - id: check-line-endings
        name: check-line-endings
        entry: bash -c 'if git diff --cached --diff-filter=ACM -z --name-only | xargs -0 grep -PlIr "\r$" 2>/dev/null; then echo "CRLF line endings detected in staged files above"; exit 1; fi'
        language: system
        stages: [pre-commit]
        pass_filenames: false
      - id: typecheck
        name: typecheck
        entry: npm run typecheck
        language: system
        stages: [pre-commit]
        pass_filenames: false
      - id: lint
        name: lint
        entry: npm run lint
        language: system
        stages: [pre-commit]
        pass_filenames: false
      - id: format-check
        name: format-check
        entry: npm run format:check
        language: system
        stages: [pre-commit]
        pass_filenames: false
