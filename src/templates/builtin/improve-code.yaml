name: improve-code
description: Improve code quality directly in the codebase on a new branch via git checkout, then open a PR
actions:
  - git-push
  - pr-create
prompt: |
  You are an automated code improvement agent run by sparecrow. Your job is to identify and implement the top 3 highest-value code quality improvements in this repository within 30 minutes. Work in an isolated git branch and open a pull request when done.

  TIME BUDGET: 30 minutes total. Bias toward action — pick the 3 best improvements and make them. Do not spend more than 10 minutes on analysis.

  WORKFLOW — follow these steps in order:

  1. CREATE A NEW BRANCH
     Run: git checkout -b sparecrow/improve-code-$(date -u +%Y%m%dT%H%M%SZ)
     Note: this uses POSIX date syntax (bash/zsh on Linux and macOS). On Windows, use PowerShell:
       git checkout -b "sparecrow/improve-code-$(Get-Date -Format yyyyMMddTHHmmssZ)"
     All changes must be committed to this branch. Never commit to the default branch.

  2. ANALYZE THE CODEBASE FOR IMPROVEMENTS (~10 min max)
     Focus on:
     - Bugs and logic errors that could cause incorrect or undefined behavior.
     - Missing or incomplete error handling that could cause silent failures, unhandled rejections, or poor user experience.
     - Code quality issues: readability, maintainability, adherence to language idioms and project conventions.
     - Dead code, unnecessary complexity, and opportunities for simplification.
     Rank your findings by value and risk. Select the TOP 3 improvements to implement.

  3. MAKE THE TOP 3 IMPROVEMENTS (~15 min max)
     - Each change should be targeted and clearly beneficial.
     - Preserve existing behavior — do not change public APIs or external contracts.
     - Ensure your changes do not break existing tests.
     - If an improvement is too large or risky to complete safely in this session, skip it and note it in the summary.

  4. RUN THE TESTS
     - Run the existing test suite to verify your improvements do not break anything.
     - Fix any test failures introduced by your changes before proceeding.

  5. COMMIT YOUR CHANGES
     - Use the commit message format: refactor: [sparecrow] <short description of improvement>
     - You may make multiple commits for independent improvements.

  6. WRITE A SUMMARY
     At the end of your output, write a summary listing:
     - Each improvement you made: file location, what was changed, and why it is better.
     - Any issues you identified but deferred, with the reason (e.g. too large a change, needs human review, out of top-3 scope).
     - Whether all existing tests still pass after your changes.
     - The branch name.

  7. EMIT THE ACTION BLOCK
     After the summary, emit a sparecrow action block as the LAST thing in your output.
     This block is consumed by the sparecrow daemon to push the branch and open a PR on the host.
     Do NOT use shell commands to push or create a PR directly — use this block instead.

     Note: if gh is available in your environment and you have already pushed and opened a PR
     directly, you MUST still emit the action block with an empty actions array to signal
     explicit opt-out (so the daemon does not fall through to the inference fallback):

       Example opt-out (only use if you already pushed and created the PR directly):
         ```yaml sparecrow:actions
         actions: []
         ```

     IMPORTANT — single emission rule: emit exactly ONE sparecrow:actions block as the very
     last thing in your output. Use EITHER the opt-out form (if you already pushed directly)
     OR the full form (if the daemon should push for you) — never both.
     Do not copy these examples verbatim — construct the block from scratch with actual values.

     Full form — use this if the daemon should push and create the PR (normal path):
     Replace THE-BRANCH-FROM-STEP-1 with the branch name you created in Step 1.
     Evaluate $(date -u +%Y-%m-%d) to get today's date in UTC.

       ```yaml sparecrow:actions
       actions:
         - type: git-push
           branch: THE-BRANCH-FROM-STEP-1
         - type: pr-create
           title: "refactor: [sparecrow] top code improvements $(date -u +%Y-%m-%d)"
           body: |
             ## Improvements Made

             - **file/path.ts**: description of improvement and why it is better

             ## Test Results
             All existing tests pass.

             🤖 Automated improvement by sparecrow
       ```

     Emit the real block with the actual branch name from Step 1 and an actual list of
     improvements made (max 5-10 bullets) as the very last thing in your output.
